name: Build Riy Agent APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Buildozer
      uses: kivy/buildozer@master
      with:
        command: android debug
        buildozer-version: 1.6.0
        requirements: python3,kivy
        sdk: '33'
        minapi: '21'
        ndk: '23b'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: riy-agent-apk
        path: bin/*.apk
