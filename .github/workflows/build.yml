name: CI

# Runs on every pull request, every push to main, and manually from the
# Actions tab. It verifies the Expo (React Native) app compiles, then
# bundles it for Android and uploads the bundle as an artifact.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & bundle (Android)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Bundle for Android (Metro/Hermes)
        run: bunx expo export --platform android --output-dir dist-android

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: dist-android
          if-no-files-found: error
