name: Build Riy Agent APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-global
        restore-keys: |
          ${{ runner.os }}-buildozer-global

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          wget \
          libffi-dev \
          libssl-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev \
          unzip \
          openjdk-17-jdk \
          patch

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython==0.29.36

    - name: Accept Android SDK licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "Accepted licenses:"
        cat $ANDROID_HOME/licenses/android-sdk-license

    - name: Show Buildozer version
      run: |
        buildozer --version
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "Current directory: $(pwd)"
        ls -la

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug 2>&1 | tee buildozer.log
      timeout-minutes: 45

    - name: Check build results
      if: always()
      run: |
        echo "=== Bin directory contents ==="
        ls -la bin/ 2>/dev/null || echo "bin/ directory does not exist!"
        echo ""
        echo "=== Looking for APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found anywhere!"
        echo ""
        echo "=== Last 50 lines of buildozer log ==="
        tail -50 buildozer.log 2>/dev/null || echo "No log file found"

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: riy-agent-apk
        path: bin/*.apk
        if-no-files-found: error

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-error-log
        path: buildozer.log
