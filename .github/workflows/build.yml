name: Build Riy Agent APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git wget libffi-dev libssl-dev \
          autoconf automake libtool pkg-config zlib1g-dev \
          unzip openjdk-17-jdk patch expect

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Prepare Android SDK licenses
      run: |
        mkdir -p $HOME/.android
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "Licenses accepted:"
        cat $ANDROID_HOME/licenses/android-sdk-license

    - name: Build APK
      run: |
        # استخدام script لتجاوز مشكلة Broken pipe
        script -q -c "buildozer -v android debug" buildozer_output.log || true
        echo "Build completed with exit code: $?"
      timeout-minutes: 45
      env:
        ANDROID_HOME: /home/runner/android-sdk
        ANDROID_SDK_ROOT: /home/runner/android-sdk

    - name: Check build results
      if: always()
      run: |
        echo "=== Looking for APK ==="
        find . -name "*.apk" -type f
        echo "=== Last 100 lines of log ==="
        tail -100 buildozer_output.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: riy-agent-apk
        path: bin/*.apk

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-logs
        path: buildozer_output.log
