name: Build Riy Agent APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git wget libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev unzip openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade buildozer cython==0.29.36

    - name: Build APK with Buildozer
      run: |
        yes y | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: riy-agent-apk
        path: bin/*.apk
