name: Build Riy Agent APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git wget libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev unzip openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade buildozer cython==0.29.36

    - name: Accept Android SDK licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_HOME/licenses/android-sdk-license

    - name: Build APK with Buildozer
      run: |
        buildozer android debug || true

    - name: Check for APK
      run: |
        ls -la bin/*.apk || echo "No APK found - checking logs above"

    - name: Upload APK Artifact
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: riy-agent-apk
        path: bin/*.apk
